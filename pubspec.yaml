name: gg_multi_maintain
description: "Runs maintenance tasks like SDK, DNA and dependency upgrades in all ocean repos in parallel and publishes every changed repo."
version: 0.0.2
repository: https://github.com/ggsuite/gg_multi_maintain.git

environment:
  sdk: ">=3.13.0 <4.0.0"

executables:
  gg_multi_maintain:
dependencies:
  args: ^2.7.0
  gg_args: ^3.2.0
  gg_console_colors: ^2.5.0
  gg_lang: ^0.8.3
  gg_local_package_dependencies: ^4.2.3
  gg_log: ^1.2.0
  gg_multi_core: ^4.14.1
  gg_one: ^14.4.12
  gg_process: ^1.4.0
  gg_publish: ^4.10.2
  path: ^1.9.1
  pub_semver: ^2.2.1
  yaml: ^3.1.4
dev_dependencies:
  dna_ggsuite: ^1.0.0
  helix: ^1.14.0
  lints: ^6.1.0
  test: ^1.33.0
